name: Build container image

# Publishes ghcr.io/ehsankahrizi/twl_camera_crossvalidation for the ECS service:
#   :latest and :sha-<commit> from main, :pr-<number> from pull requests.
on:
  push:
    branches: [main]
    paths: ['crossval/**', 'requirements.txt', 'Dockerfile', '.github/workflows/docker.yml']
  pull_request:
    paths: ['crossval/**', 'requirements.txt', 'Dockerfile', '.github/workflows/docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twl_camera_crossvalidation
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
